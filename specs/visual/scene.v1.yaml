schemaVersion: mandelhowl.scene-spec.v1
canonicalOwner:
  path: specs/visual/scene.v1.yaml
  policy: edit-source-regenerate-derived

coordinateSystem:
  type: normalized-apparatus
  xDirection: left-to-right
  yDirection: top-to-bottom
  zDirection: toward-viewer

camera:
  projection: perspective
  fieldOfViewDegrees: 38
  near: 0.1
  far: 100
  target: [0, 0, 0]

apparatus:
  speaker:
    position: [-1.35, 0.18, 0.1]
    aimTarget: [0, 0, 0]
  plate:
    position: [0, 0, 0]
    radius: 1
    frontNormal: [0, 0, 1]
  microphone:
    position: [1.34, -0.12, 0.42]
    aimTarget: [0, 0, 0]
  cable:
    direction: microphone-to-feedback-to-speaker

readOrder:
  - speaker
  - plate
  - microphone
  - feedback-loop
  - volume

inputCount: 1
outputCount: 1
