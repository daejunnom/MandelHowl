name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-baker-nversion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p mandelhowl-baker-native --bin mandelhowl-baker-native
      - run: node --test tools/baker-supervisor/test/*.test.mjs
      - run: node tools/baker-supervisor/src/supervisor.mjs self-test --strict
        env:
          MANDELHOWL_NATIVE_BAKER: ${{ github.workspace }}/target/release/mandelhowl-baker-native
      - run: node tools/baker-supervisor/src/supervisor.mjs validate --strict
        env:
          MANDELHOWL_NATIVE_BAKER: ${{ github.workspace }}/target/release/mandelhowl-baker-native
      - name: Fresh Linux native dual-generation quality evidence
        run: >-
          node tools/baker-supervisor/src/supervisor.mjs generate
          --strict
          --coverage-report tests/runtime/fixtures/reachability-report.json
          --timeout-ms 2400000
          --output-root "${{ runner.temp }}/mandelhowl-nversion-output"
          --attestation-bundle "${{ runner.temp }}/baker-nversion-attestation"
          --report-file "${{ runner.temp }}/baker-nversion-attestation/attestation.json"
        env:
          MANDELHOWL_NATIVE_BAKER: ${{ github.workspace }}/target/release/mandelhowl-baker-native

      - name: Upload fresh Linux quality attestation
        uses: actions/upload-artifact@v4
        with:
          name: baker-nversion-quality-attestation
          path: ${{ runner.temp }}/baker-nversion-attestation
          if-no-files-found: error
          retention-days: 7

  full-verification:
    needs: native-baker-nversion
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npx playwright install chromium

      - name: Verify handoff against committed pinned OCI evidence
        run: >-
          npm run handoff:verify --
          --report "${{ runner.temp }}/mandelhowl-handoff-verification.json"

      - name: Upload whole-handoff verification report
        uses: actions/upload-artifact@v4
        with:
          name: handoff-verification-report
          path: ${{ runner.temp }}/mandelhowl-handoff-verification.json
          if-no-files-found: error
          retention-days: 7
