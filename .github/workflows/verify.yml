name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-verification:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run verify
      - run: npm run baker:rust:test
      - run: npm run physics:validate:strict
      - run: npm run release:verify -- --require-clean
      - run: npm run release:archive
      - run: npm run release:archive:check
